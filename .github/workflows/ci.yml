name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench:validate
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check registry signatures and provenance
        run: npm audit signatures

  servers:
    # The upstream MCP servers install from lockfiles: check the lockfiles are honest and the tool locks still match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix servers
      - run: npm audit --prefix servers --audit-level=high
      - run: npm audit signatures --prefix servers
      - run: uv lock --check --project servers/python
      - name: Tool definitions still match the committed locks
        run: npm run lock:verify -- filesystem notion/token playwright
